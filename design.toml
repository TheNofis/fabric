# Fabric-shell design tokens.

[color]
bg = "#1C1C1E"
bg_critical = "alpha(#FF453A, 0.28)"
foreground = "#F5F5F7"
muted = "alpha(#F5F5F7, 0.64)"
icon = "alpha(#F5F5F7, 0.85)"
border = "alpha(white, 0.12)"
highlight = "alpha(white, 0.08)"  # inset top edge of glass
accent = "#0A84FF"
accent_fill = "#0071E3"  # fills under white text
critical = "#FF453A"
critical_fill = "#D93A30"  # fills under white text
info = "#64D2FF"
transparent = "transparent"

[opacity]
bar = 0.30    # bg_bar = alpha(bg, bar)
panel = 0.42  # bg_panel = alpha(bg, panel): popups, launcher, OSD, notifications, tooltips
hover = 0.10
active = 0.12
track = 0.30
track_subtle = 0.25
shadow = 0.42

[font]
family = "Inter"
family_mono = "JetBrainsMono Nerd Font"  # bar metrics, so digits do not jump
family_icon = "Symbols Nerd Font"
size = "13px"
weight = 400
weight_emphasis = 600
size_icon = "14px"
size_caption = "10px"
size_small = "11px"
size_body = "12px"
size_title = "14px"
size_large = "30px"

[spacing]
micro = "2px"
xs = "4px"
sm = "5px"
md = "8px"
lg = "10px"
xl = "12px"
xxl = "14px"
panel = "16px"
popup = "18px"
section = "20px"
bar_top = "8px"

[radius]
xs = "2px"
sm = "6px"
md = "7px"     # workspace buttons, concentric with island
lg = "8px"
island = "12px"
card = "12px"  # notification cards inside the center
popup = "18px"
launcher = "20px"
osd = "22px"
center = "24px"
pill = "999px"

[size]
bar_height = "40px"
icon_button = "24px"
button_large = "38px"
status_icon = "42px"
notification_width = "352px"
music_width = "384px"
osd_width = "344px"
volume_slider = "88px"
percent_width = "38px"
speed_width = "44px"
time_width = "36px"

[stroke]
progress = "4px"
progress_music = "5px"
slider = "6px"
slider_thumb = "10px"
slider_thumb_large = "12px"

[motion]
ease = "cubic-bezier(0.32, 0.72, 0, 1)"  # Apple-like decel
fast = "160ms"
normal = "220ms"
osd_timeout = "1500ms"

[shadow]
osd = "0 16px 36px rgba(0, 0, 0, 0.35)"

[layer]
bar = 10
popup = 20
osd = 30
notification = 40

[state]
normal = "foreground"
focused = "accent"
critical = "critical"
muted = "critical"
secondary = "info"
