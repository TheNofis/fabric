backend = "glx";
vsync = true;
use-damage = true;
xrender-sync-fence = true;

corner-radius = 12;  # windows; the shell's panels are rounder (18-24), so they read as a layer above

blur: {
  method = "dual_kawase";
  strength = 12;
};

rules = (
  {
    # blur only the Fabric shell (its windows are shaped to their panels, see MonitorWindow.clip_to)
    match = "class_g != 'Config.py'";
    blur-background = false;
  },
  {
    # app windows float over the wallpaper like the shell's panels; menus and tooltips draw their own
    match = "window_type = 'normal' || window_type = 'dialog'";
    shadow = true;
    # open/close stay instant; when i3 re-tiles (a window opens or closes beside them),
    # the others glide to their new place instead of jumping. Not the geometry-change preset:
    # it crossfades a snapshot of the old frame (saved-image-blend), which left ghost text behind.
    # Here the live window is only stretched from its old box for 0.15s.
    animations = (
      {
        triggers = ["geometry"];
        scale-x = { curve = "cubic-bezier(0.32, 0.72, 0, 1)"; duration = 0.15; start = "window-width-before / window-width"; end = 1; };
        scale-y = { curve = "cubic-bezier(0.32, 0.72, 0, 1)"; duration = 0.15; start = "window-height-before / window-height"; end = 1; };
        offset-x = { curve = "cubic-bezier(0.32, 0.72, 0, 1)"; duration = 0.15; start = "window-x-before - window-x"; end = 0; };
        offset-y = { curve = "cubic-bezier(0.32, 0.72, 0, 1)"; duration = 0.15; start = "window-y-before - window-y"; end = 0; };
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
      }
    );
  },
  {
    match = "fullscreen";
    corner-radius = 0;
    shadow = false;
    unredir = true;
  },
  {
    match = "class_g = 'Conky' || class_g = 'polybar' || class_g = 'Deadd-notification-center' || window_type = 'dock' || window_type = 'desktop'";
    corner-radius = 0;
  },
  {
    match = "class_g = 'Config.py'";
    blur-background = true;
    corner-radius = 0;  # the shape already rounds each panel
  },
  {
    # panels float over the wallpaper; the bar stays flat. picom follows the window shape (clip_to)
    match = "class_g = 'Config.py' && window_type != 'dock'";
    shadow = true;
  },
  {
    # tray menus aren't shaped like the panels: picom rounds them to the CSS radius
    match = "class_g = 'Config.py' && window_type = 'popup_menu'";
    corner-radius = 10;
  },
  {
    # panels only fade: no zoom, so nothing moves; the bar never animates
    match = "class_g = 'Config.py' && window_type != 'dock'";
    animations = (
      { triggers = ["open", "show"]; preset = "appear"; duration = 0.2; scale = 1.0; },
      { triggers = ["close", "hide"]; preset = "disappear"; duration = 0.15; scale = 1.0; }
    );
  }
);

shadow = false;
shadow-radius = 28;
shadow-opacity = 0.45;
shadow-offset-x = -28;
shadow-offset-y = -18;
fading = false;
