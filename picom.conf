backend = "glx";
vsync = true;
use-damage = true;
xrender-sync-fence = true;

corner-radius = 20;

blur: {
  method = "dual_kawase";
  strength = 12;
};

rules = (
  {
    # blur only the Fabric shell (its windows are shaped to their panels, see MonitorWindow.clip_to)
    match = "class_g != 'Config.py'";
    blur-background = false;
  },
  {
    match = "fullscreen";
    corner-radius = 0;
    unredir = true;
  },
  {
    match = "class_g = 'Conky' || class_g = 'polybar' || class_g = 'Deadd-notification-center' || window_type = 'dock' || window_type = 'desktop'";
    corner-radius = 0;
  },
  {
    match = "class_g = 'Config.py'";
    blur-background = true;
    corner-radius = 0;  # the shape already rounds each panel
  },
  {
    # tray menus aren't shaped like the panels: picom rounds them to the CSS radius
    match = "class_g = 'Config.py' && window_type = 'popup_menu'";
    corner-radius = 10;
  },
  {
    match = "class_g = 'Config.py'";
    animations = (
      {
        triggers = ["open", "show"];
        preset = "appear";
        duration = 0.2;
        scale = 0.9;
      },
      {
        triggers = ["close", "hide"];
        preset = "disappear";
        duration = 0.15;
        scale = 0.9;
      }
    );
  }
);

shadow = false;
fading = false;
